    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (typeof origFetch === 'function') {
            var currentFetch = origFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = typeof val === 'function' ? val : origFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_e) {
          // Graceful fallback
        }
      })();
    </script>
